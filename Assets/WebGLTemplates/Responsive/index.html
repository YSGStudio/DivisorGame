<!DOCTYPE html>
<html lang="ko-kr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* 브라우저 창 전체를 채우고, 스크롤을 만들지 않는다.
         컨테이너의 실제 크기는 아래 스크립트가 창 크기에 맞춰 계속 갱신한다. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #EAF2FF;
        overscroll-behavior: none;
      }

      /* 주소창이 접혔다 펴지는 모바일 브라우저에서도 실제 보이는 높이를 쓴다.
         dvh를 지원하지 않는 브라우저는 위의 100%로 동작한다. */
      #unity-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #EAF2FF;
        /* 캔버스가 포커스를 받을 때 생기는 외곽선 제거 */
        outline: none;
        /* 모바일에서 길게 누를 때 뜨는 선택/확대 동작 차단 */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }

      #unity-loading-title {
        color: #223055;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 14px;
      }

      #unity-progress-bar-empty {
        width: 220px;
        height: 14px;
        border-radius: 7px;
        background: #C7D6F0;
        overflow: hidden;
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        border-radius: 7px;
        background: #3D7BFF;
        transition: width 0.15s ease-out;
      }

      #unity-warning {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translate(-50%);
        z-index: 10;
        display: none;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-title">{{{ PRODUCT_NAME }}}</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') {
          div.style = 'background: #F2545B; color: white; padding: 10px; border-radius: 6px;';
        } else {
          if (type == 'warning') div.style = 'background: #FFD54F; padding: 10px; border-radius: 6px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // Unity 6 Web 런타임은 캔버스의 CSS 크기가 바뀌어도 렌더 타겟을 스스로
      // 따라 바꾸지 않는다. 그대로 두면 처음 로드했을 때의 해상도가 그대로 남아,
      // 창 크기가 달라지면 화면이 위아래로 눌리거나 잘려 보인다.
      // 그래서 크기가 바뀔 때마다 엔진에 렌더 타겟 크기를 직접 알려준다.
      var resizeHandle = null;

      function applyCanvasSize() {
        resizeHandle = null;

        // 모바일 브라우저는 주소창이 접혔다 펴지므로 visualViewport가 더 정확하다.
        var view = window.visualViewport;
        var width = Math.max(1, Math.round(view ? view.width : window.innerWidth));
        var height = Math.max(1, Math.round(view ? view.height : window.innerHeight));

        container.style.width = width + "px";
        container.style.height = height + "px";

        // 렌더 타겟은 물리 픽셀 기준이라 devicePixelRatio를 곱한다.
        // 고배율 화면에서 픽셀 수가 과도하게 늘어나 프레임이 떨어지지 않도록 2배로 제한한다.
        var ratio = Math.min(window.devicePixelRatio || 1, 2);
        var bufferWidth = Math.round(width * ratio);
        var bufferHeight = Math.round(height * ratio);
        if (canvas.width === bufferWidth && canvas.height === bufferHeight) return;

        var instance = window.unityInstance;
        if (instance && instance.Module && instance.Module.setCanvasSize) {
          instance.Module.setCanvasSize(bufferWidth, bufferHeight);
        } else {
          // 아직 로딩 중이면 엔진이 이 값을 시작 해상도로 읽어 간다.
          canvas.width = bufferWidth;
          canvas.height = bufferHeight;
        }
      }

      // 드래그로 창 크기를 바꾸면 resize가 연달아 들어오므로 프레임당 한 번만 반영한다.
      function fitToWindow() {
        if (resizeHandle !== null) cancelAnimationFrame(resizeHandle);
        resizeHandle = requestAnimationFrame(applyCanvasSize);
      }

      window.addEventListener("resize", fitToWindow);
      window.addEventListener("orientationchange", function() {
        fitToWindow();
        // 회전 직후에는 아직 이전 크기가 보고되는 기기가 있어 한 번 더 확인한다.
        setTimeout(fitToWindow, 300);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fitToWindow);
        window.visualViewport.addEventListener("scroll", fitToWindow);
      }
      // 창 크기 변화 없이 레이아웃만 바뀌는 경우(전체화면 전환 등)까지 잡는다.
      if (window.ResizeObserver) {
        new ResizeObserver(fitToWindow).observe(container);
      }
      applyCanvasSize();

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          window.unityInstance = unityInstance;
          applyCanvasSize();
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
